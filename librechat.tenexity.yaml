version: 1.3.9
cache: true

interface:
  customWelcome: "Tenexity AI Workspace is ready for client demos. Choose a Tenexity mode to create presentation outlines, executive reports, implementation briefs, dashboards, or client-ready artifacts."
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true
  webSearch: true

registration:
  socialLogins: []

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 40
    maxCitationsPerFile: 10
    minRelevanceScore: 0.35
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - tools
      - chain
      - ocr
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "openrouter/auto"
          - "anthropic/claude-sonnet-4.6"
          - "google/gemini-2.5-pro"
          - "openai/gpt-4o"
          - "qwen/qwen3-coder-30b-a3b-instruct"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: true
      summaryModel: "current_model"
      dropParams:
        - "stop"
      modelDisplayLabel: "OpenRouter"

modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: tenexity-demo-builder
      label: "Tenexity Demo Builder"
      description: "Turns rough client context into a polished live demo plan, script, and artifact checklist."
      group: "Tenexity Demo Modes"
      groupIcon: openAI
      default: true
      order: 1
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: openAI
        model: gpt-4o
        temperature: 0.35
        instructions: |
          You are Tenexity's demo builder. Convert sparse client context into a crisp demo narrative, live-click script, artifact checklist, and follow-up plan.
          Be concrete. Use headings, tables, and decision points. When the user asks for a presentation or report, produce content that can be pasted into slides or a client-facing document.

    - name: presentation-studio
      label: "Presentation Studio"
      description: "Creates slide outlines, talk tracks, diagrams, and executive-level messaging."
      group: "Tenexity Demo Modes"
      order: 2
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: openAI
        model: gpt-4o
        temperature: 0.45
        instructions: |
          You are a senior presentation strategist. Build tight slide narratives with titles, slide objectives, visual direction, speaker notes, and appendix material.
          Favor useful structure over decoration. Ask only for missing business-critical facts; otherwise make practical assumptions and label them.

    - name: report-analyst
      label: "Report Analyst"
      description: "Creates business reports with methodology, assumptions, tables, risks, and next steps."
      group: "Tenexity Demo Modes"
      order: 3
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: openAI
        model: gpt-4o
        temperature: 0.25
        instructions: |
          You are a rigorous business analyst. Build reports that can survive stakeholder scrutiny: executive summary, methodology, assumptions, calculations, evidence, risks, and recommended actions.
          Be explicit about what is known, inferred, or missing. Use tables when they make the report easier to audit.

    - name: client-workshop
      label: "Client Workshop"
      description: "Prepares discovery agendas, facilitation guides, and implementation workstreams."
      group: "Tenexity Demo Modes"
      order: 4
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: anthropic
        model: claude-sonnet-4-6
        temperature: 0.35
        instructions: |
          You are a client workshop lead. Produce practical workshop agendas, discovery questions, decision logs, artifacts to collect, and implementation workstreams.
          Keep outputs grounded in the client's operating reality and turn ambiguity into clearly named decisions.

    - name: openrouter-auto
      label: "OpenRouter Auto"
      description: "Lets OpenRouter route to a strong model for the request; useful for quick model comparison."
      group: "OpenRouter Models"
      groupIcon: "OpenRouter"
      order: 10
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: "OpenRouter"
        model: "openrouter/auto"
        temperature: 0.35
        instructions: |
          You are Tenexity's general-purpose model router. Choose the simplest structure that answers the request well.
          When creating artifacts, make the output immediately usable: slide outlines, report sections, Mermaid diagrams, React prototypes, HTML dashboards, or tables.

    - name: openrouter-strategy
      label: "OpenRouter Strategy"
      description: "Uses Claude via OpenRouter for narrative strategy, workshop design, and executive writing."
      group: "OpenRouter Models"
      order: 11
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: "OpenRouter"
        model: "anthropic/claude-sonnet-4.6"
        temperature: 0.35
        instructions: |
          You are a senior Tenexity strategy partner. Build executive narratives, workshop plans, proposal structures, and decision-ready client material.
          Prefer clear business logic, concrete examples, and crisp next steps.

    - name: openrouter-dashboard-builder
      label: "OpenRouter Dashboard Builder"
      description: "Uses Gemini via OpenRouter for data-heavy reports, dashboard briefs, and visual artifact plans."
      group: "OpenRouter Models"
      order: 12
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: "OpenRouter"
        model: "google/gemini-2.5-pro"
        temperature: 0.25
        instructions: |
          You are a dashboard and analytics designer. Turn messy data, notes, or uploaded files into dashboard concepts, KPI taxonomies, charts, and implementation-ready report sections.
          When useful, produce Mermaid diagrams, chart specs, table schemas, or React/HTML artifact instructions.

    - name: openrouter-artifact-coder
      label: "OpenRouter Artifact Coder"
      description: "Uses Qwen Coder via OpenRouter for React, HTML, Mermaid, and dashboard artifacts."
      group: "OpenRouter Models"
      order: 13
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: "OpenRouter"
        model: "qwen/qwen3-coder-30b-a3b-instruct"
        temperature: 0.2
        instructions: |
          You are a pragmatic artifact engineer. Build clean React, HTML, Mermaid, and dashboard artifacts that can be copied into implementation.
          Keep interfaces useful, compact, accessible, and aligned to Tenexity's operational-product style.

fileConfig:
  endpoints:
    default:
      fileLimit: 8
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - "application/pdf"
        - "text/.*"
        - "application/json"
        - "application/csv"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    openAI:
      fileLimit: 8
      fileSizeLimit: 25
      totalSizeLimit: 100
    anthropic:
      fileLimit: 8
      fileSizeLimit: 25
      totalSizeLimit: 100
  serverFileSizeLimit: 100
  avatarSizeLimit: 2
