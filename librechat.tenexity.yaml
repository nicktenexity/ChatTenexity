version: 1.3.9
cache: true

interface:
  customWelcome: 'Tenexity AI Workspace is ready. Ask ChatGPT a question, upload a file, or start a practical workflow.'
  fileSearch: true
  modelSelect: false
  parameters: false
  presets: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true
  webSearch: true

registration:
  socialLogins: []

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 40
    maxCitationsPerFile: 10
    minRelevanceScore: 0.35
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - tools
      - chain
      - ocr

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: chatgpt
      label: 'ChatGPT'
      description: 'Default Tenexity chat mode powered by OpenAI.'
      group: 'Tenexity'
      groupIcon: openAI
      default: true
      order: 1
      artifacts: true
      fileSearch: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: openAI
        model: gpt-5.4-mini
        temperature: 0.2
        reasoning_effort: low
        instructions: |
          You are ChatGPT inside Tenexity AI Workspace.
          Answer clearly and practically. Help the user ask questions, reason through work, draft content, analyze uploaded files, and plan next actions.
          When a task depends on live company systems, explain what source connection would be needed instead of pretending you have access.
          Keep answers concise unless the user asks for a deeper artifact, report, plan, or implementation detail.

fileConfig:
  endpoints:
    default:
      fileLimit: 8
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - 'application/pdf'
        - 'text/.*'
        - 'application/json'
        - 'application/csv'
        - 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
        - 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
        - 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    openAI:
      fileLimit: 8
      fileSizeLimit: 25
      totalSizeLimit: 100
  serverFileSizeLimit: 100
  avatarSizeLimit: 2
