<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Tenexity AI Workspace - operational AI for presentations, reports, dashboards, and client-ready artifacts" />
    <title>Tenexity AI Workspace</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;
      let logoUrl;

      if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
        logoUrl = 'assets/tenexity-logo-white.png';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
        logoUrl = 'assets/tenexity-logo-black.png';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
        logoUrl = prefersDarkScheme
          ? 'assets/tenexity-logo-white.png'
          : 'assets/tenexity-logo-black.png';
      } else {
        backgroundColor = '#ffffff';
        logoUrl = 'assets/tenexity-logo-black.png';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }

        #loading-container::before {
          content: "";
          width: min(56vw, 360px);
          aspect-ratio: 5 / 1;
          background-image: url("${logoUrl}");
          background-position: center;
          background-repeat: no-repeat;
          background-size: contain;
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
  </body>
</html>
